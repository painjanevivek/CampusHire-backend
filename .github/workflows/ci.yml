name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest
      - name: Verify authoritative OpenAPI snapshot
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi/campushire.openapi.json
      - run: python scripts/smoke_phases.py
      - run: python -m pip check
      - run: alembic heads
      - name: Reject committed private keys
        run: '! git grep -n -E "BEGIN (RSA|OPENSSH) PRIVATE KEY" -- .'
