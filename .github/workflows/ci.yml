name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: campushire
          POSTGRES_PASSWORD: campushire
          POSTGRES_DB: campushire_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campushire -d campushire_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://campushire:campushire@127.0.0.1:5432/campushire_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Build the credential-free PDF parser image
        run: docker build --file Dockerfile.parser --tag campushire-pdf-parser:test .
      - name: Build the multi-architecture ClamAV runtime source
        run: |
          docker build --file Dockerfile.clamav --tag campushire-clamav:test .
          docker run --rm --entrypoint clamd campushire-clamav:test --version
      - name: Verify parser isolation and container behavior
        env:
          RUN_PARSER_CONTAINER_TESTS: "1"
        run: |
          pytest tests/test_resume_parser.py
          python scripts/verify_parser_sandbox.py --image campushire-pdf-parser:test
          docker run --rm --entrypoint python campushire-pdf-parser:test -m pip check
      - name: Verify parser separation and legitimate PDF generation
        run: |
          docker build --tag campushire-backend:test .
          docker run --rm --entrypoint python campushire-backend:test -c "from app.modules.resumes.builder import ResumeContent, generate_pdf; assert generate_pdf(ResumeContent(full_name='Test Student', email='test@example.edu')).startswith(b'%PDF-')"
      - run: ruff check .
      - run: mypy app parser_runtime/main.py scripts/verify_parser_sandbox.py scripts/seed_staging_synthetic.py scripts/seed_recovery_fixture.py scripts/seed_performance_fixture.py scripts/smoke_staging.py scripts/rehearse_dependency_failures.py scripts/measure_pilot_http.py scripts/estimate_pilot_cost.py scripts/build_release_candidate_manifest.py scripts/hash_release_configuration.py scripts/validate_oci_environment.py scripts/validate_shared_vm_environment.py
      - run: pytest
      - name: Verify authoritative OpenAPI snapshot
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi/campushire.openapi.json
      - run: python scripts/smoke_phases.py
      - run: python scripts/evaluate_matching.py
      - run: python -m pip check
      - name: Rehearse the latest PostgreSQL migration
        run: |
          alembic upgrade head
          alembic downgrade 20260828_0014
          alembic upgrade head
          test "$(alembic current | awk '{print $1}')" = "20260828_0015"
      - name: Reject committed private keys
        run: '! git grep -n -E "BEGIN (RSA|OPENSSH) PRIVATE KEY" -- .'
