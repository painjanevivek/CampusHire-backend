[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campushire-backend"
version = "0.1.0"
description = "CampusHire AI backend API"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.19.1",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "cryptography==50.0.0",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "google-genai==2.17.0",
  "langgraph==1.2.10",
  "oci==2.184.2",
  "pydantic-settings==2.15.0",
  "pymupdf==1.28.2",
  "python-multipart==0.0.32",
  "qdrant-client==1.19.0",
  "redis==8.1.0",
  "sqlalchemy[asyncio]==2.0.51",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "httpx==0.28.1",
  "mypy==1.20.2",
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "ruff==0.16.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
